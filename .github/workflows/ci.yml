name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # 这里没有外部依赖（无 DB / Redis），所以不需要 service 容器
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Syntax check (py_compile)
        run: |
          python -m compileall -q app/ tests/

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app/ tests/

      - name: Run unit tests with coverage
        env:
          # 测试环境 env 由 backend/tests/conftest.py 统一注入（conftest 直接赋值，
          # 先于一切 test 模块 import 生效，会覆盖这里的值），此处仅作兜底。
          APP_API_KEY: ""
          RATE_LIMIT_GENERAL_PER_MIN: 100
          RATE_LIMIT_EXPENSIVE_PER_MIN: 10
          LOG_LEVEL: WARNING
        run: |
          # --cov-fail-under=70：覆盖率 < 70% 失败阻断合并（阻止覆盖率回退）
          # 当前 baseline 见 CHANGELOG；后续逐步提高到 80%
          # 不用 -x：即使前面失败也要列出全部失败，避免掩盖真实失败数量
          python -m pytest tests/ -v --tb=short \
            --cov=app --cov-report=term-missing --cov-fail-under=70
        # pytest + 覆盖率失败必须阻断合并
        continue-on-error: false

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint (ESLint)
        run: |
          npx eslint src tests --ext .ts,.tsx --max-warnings 50

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Build
        env:
          # BFF 代理（src/app/api/proxy）在服务端读取这两个变量；构建期仅占位，
          # 真实值在部署环境注入。旧的 NEXT_PUBLIC_API_BASE/API_KEY 已废弃
          # （浏览器 bundle 不再包含任何密钥）
          BACKEND_URL: "http://localhost:8000"
          BACKEND_API_KEY: ""
        run: npm run build

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "❌ Backend failed: ${{ needs.backend.result }}"
            exit 1
          fi
          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ Frontend failed: ${{ needs.frontend.result }}"
            exit 1
          fi
          echo "✅ All checks passed"